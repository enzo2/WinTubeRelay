<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinTubeRelay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #101820 0%, #233d4d 52%, #4f2d36 100%);
            min-height: 100vh;
            color: #f8fafc;
            padding: 16px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 18px;
            font-weight: 650;
            letter-spacing: 2px;
        }
        
        .card {
            background: rgba(12, 18, 27, 0.74);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid rgba(226, 232, 240, 0.14);
            box-shadow: 0 16px 38px rgba(0, 0, 0, 0.22);
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #cbd5e1;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(148, 163, 184, 0.4);
            border-radius: 8px;
            background: rgba(248, 250, 252, 0.94);
            color: #111827;
            font-size: 16px;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.26);
        }
        
        .btn {
            padding: 14px 24px;
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .play-actions {
            display: grid;
            gap: 10px;
        }
        
        .btn-primary {
            background: #f97316;
            color: #111827;
            width: 100%;
        }
        
        .btn-primary:hover {
            background: #fb923c;
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(249, 115, 22, 0.36);
        }

        .btn-secondary {
            background: rgba(20, 184, 166, 0.16);
            border-color: rgba(45, 212, 191, 0.34);
            color: #ccfbf1;
            width: 100%;
        }

        .btn-secondary:hover {
            background: rgba(20, 184, 166, 0.26);
            border-color: rgba(94, 234, 212, 0.58);
            transform: translateY(-2px);
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 8rem), 1fr));
            gap: 12px;
        }
        
        .btn-control {
            background: rgba(248, 250, 252, 0.1);
            border-color: rgba(226, 232, 240, 0.16);
            color: #f8fafc;
            padding: 16px;
            min-width: 0;
            white-space: normal;
        }
        
        .btn-control:hover {
            background: rgba(248, 250, 252, 0.17);
            border-color: rgba(226, 232, 240, 0.3);
        }
        
        .btn-control:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 12px;
        }
        
        input[type="range"] {
            flex: 1;
            height: 8px;
            -webkit-appearance: none;
            background: rgba(203, 213, 225, 0.36);
            border-radius: 4px;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: #14b8a6;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.24);
        }
        
        .volume-value {
            min-width: 50px;
            text-align: center;
            font-weight: 600;
        }
        
        .status {
            font-size: 14px;
            line-height: 1.8;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(226, 232, 240, 0.12);
        }
        
        .status-item:last-child {
            border-bottom: none;
        }

        .saved-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .saved-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(248, 250, 252, 0.08);
            border: 1px solid rgba(226, 232, 240, 0.08);
        }

        .saved-meta {
            flex: 1;
            min-width: 0;
        }

        .saved-name {
            font-weight: 600;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .saved-url {
            font-size: 12px;
            opacity: 0.75;
            word-break: break-all;
        }

        .saved-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
        }

        .inline-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        
        .status-label {
            opacity: 0.7;
        }
        
        .status-value {
            font-weight: 500;
            overflow-wrap: anywhere;
            text-align: right;
        }
        
        .message {
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        
        .message.success {
            background: rgba(20, 184, 166, 0.9);
            display: block;
        }
        
        .message.error {
            background: rgba(220, 38, 38, 0.92);
            display: block;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .control-section {
            margin-top: 18px;
        }

        @media (max-width: 520px) {
            .saved-row {
                align-items: stretch;
                flex-direction: column;
            }

            .saved-meta {
                width: 100%;
            }

            .saved-actions {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 7rem), 1fr));
                width: 100%;
            }

            .saved-actions .btn-small {
                min-width: 0;
                white-space: normal;
            }

            .status-item {
                align-items: flex-start;
                flex-direction: column;
                gap: 2px;
            }

            .status-value {
                text-align: left;
            }
        }

        @media (min-width: 700px) {
            .play-actions {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (min-width: 900px) {
            body {
                padding: 28px;
            }

            .container {
                display: grid;
                grid-template-columns: minmax(0, 1.05fr) minmax(340px, 0.95fr);
                grid-template-areas:
                    "title title"
                    "play status"
                    "controls status"
                    "favorites recent";
                gap: 18px;
                max-width: 1120px;
            }

            h1 {
                grid-area: title;
                margin-bottom: 2px;
                text-align: left;
            }

            .card {
                margin-bottom: 0;
            }

            .play-card {
                grid-area: play;
            }

            .status-card {
                grid-area: status;
            }

            .controls-card {
                grid-area: controls;
            }

            .favorites-card {
                grid-area: favorites;
            }

            .recent-card {
                grid-area: recent;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WinTubeRelay</h1>
        
        <div class="card play-card">
            <div class="form-group">
                <label>YouTube URL</label>
                <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=...">
            </div>
            
            <div class="play-actions">
                <button class="btn btn-primary" onclick="play(false, 'play')">
                    <span id="playText">Play Now</span>
                    <span id="playSpinner" class="loading" style="display: none;"></span>
                </button>
                <button class="btn btn-secondary" onclick="play(true, 'queue')">
                    <span id="queueText">Add to Queue</span>
                    <span id="queueSpinner" class="loading" style="display: none;"></span>
                </button>
            </div>
            
            <div id="message" class="message"></div>
        </div>

        <div class="card status-card">
            <label>Status</label>
            <div class="status" id="status">
                <div class="status-item">
                    <span class="status-label">Title:</span>
                    <span class="status-value" id="statusTitle">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Status:</span>
                    <span class="status-value" id="statusState">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Position:</span>
                    <span class="status-value" id="statusPosition">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Volume:</span>
                    <span class="status-value" id="statusVolume">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Playlist:</span>
                    <span class="status-value" id="statusPlaylist">-</span>
                </div>
            </div>
        </div>

        <div class="card controls-card">
            <label>Playback Controls</label>
            <div class="controls">
                <button class="btn btn-control" onclick="pause()">Pause</button>
                <button class="btn btn-control" onclick="resume()">Resume</button>
                <button class="btn btn-control" onclick="toggle()">Toggle</button>
                <button class="btn btn-control" onclick="stop()">Stop</button>
                <button class="btn btn-control" onclick="skip()">Skip</button>
                <button class="btn btn-control" onclick="quit()">Quit</button>
            </div>
            <div class="control-section">
                <label>Volume</label>
                <div class="volume-control">
                    <input type="range" id="volumeSlider" min="0" max="100" value="50" onchange="setVolume(this.value)">
                    <span class="volume-value" id="volumeValue">50%</span>
                </div>
                <div class="controls" style="margin-top: 16px;">
                    <button class="btn btn-control" onclick="mute()">Mute</button>
                    <button class="btn btn-control" onclick="unmute()">Unmute</button>
                </div>
            </div>
        </div>

        <div class="card favorites-card">
            <label>Favorites</label>
            <div class="form-group">
                <label>Favorite Name</label>
                <input type="text" id="favoriteNameInput" placeholder="My playlist or station">
            </div>
            <div class="form-group">
                <label>Favorite URL</label>
                <input type="text" id="favoriteUrlInput" placeholder="https://www.youtube.com/watch?v=...">
            </div>
            <div class="inline-actions">
                <button class="btn btn-control btn-small" onclick="useCurrentUrlForFavorite()">Use Current URL</button>
                <button class="btn btn-control btn-small" onclick="addFavorite()">Add Favorite</button>
                <button class="btn btn-control btn-small" onclick="clearFavorites()">Clear Favorites</button>
            </div>
            <div class="saved-list" id="favoritesList" style="margin-top: 16px;"></div>
        </div>

        <div class="card recent-card">
            <label>Recent</label>
            <div class="inline-actions">
                <button class="btn btn-control btn-small" onclick="refreshSavedData()">Refresh</button>
                <button class="btn btn-control btn-small" onclick="clearRecent()">Clear Recent</button>
            </div>
            <div class="saved-list" id="recentList" style="margin-top: 16px;"></div>
        </div>

    </div>

    <script>
        const API_BASE = '';
        let lastPlaybackErrorShown = '';
        
        function getHeaders() {
            return {
                'Content-Type': 'application/json'
            };
        }
        
        function showMessage(text, isError = false) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + (isError ? 'error' : 'success');
            setTimeout(() => {
                msg.className = 'message';
            }, 3000);
        }

        async function getErrorText(response) {
            try {
                const data = await response.json();
                return data.detail || data.error || JSON.stringify(data);
            } catch {
                return await response.text();
            }
        }
        
        function setLoading(elementId, loading) {
            const text = document.getElementById(elementId + 'Text');
            const spinner = document.getElementById(elementId + 'Spinner');
            if (loading) {
                if (text) text.style.display = 'none';
                if (spinner) spinner.style.display = 'inline-block';
            } else {
                if (text) text.style.display = 'inline';
                if (spinner) spinner.style.display = 'none';
            }
        }
        
        async function play(enqueue = false, actionId = 'play') {
            const url = document.getElementById('urlInput').value;
            if (!url) {
                showMessage('Please enter a YouTube URL', true);
                return;
            }
            
            setLoading(actionId, true);
            
            try {
                const response = await fetch(`${API_BASE}/play`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({
                        url: url,
                        enqueue
                    })
                });
                
                if (response.ok) {
                    showMessage(enqueue ? 'Queued URL' : 'Playback request sent');
                    document.getElementById('urlInput').value = '';
                    updateStatus();
                    refreshSavedData();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
            
            setLoading(actionId, false);
        }
        
        async function stop() {
            try {
                const response = await fetch(`${API_BASE}/stop`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                if (response.ok) {
                    showMessage('Stopped');
                    updateStatus();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }
        
        async function pause() {
            try {
                const response = await fetch(`${API_BASE}/pause`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                if (response.ok) {
                    showMessage('Paused');
                    updateStatus();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }
        
        async function resume() {
            try {
                const response = await fetch(`${API_BASE}/resume`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                if (response.ok) {
                    showMessage('Resumed');
                    updateStatus();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }
        
        async function toggle() {
            try {
                const response = await fetch(`${API_BASE}/toggle`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                if (response.ok) {
                    showMessage('Toggled');
                    updateStatus();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }
        
        async function skip() {
            try {
                const response = await fetch(`${API_BASE}/skip`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                if (response.ok) {
                    showMessage('Skipped to next');
                    updateStatus();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }
        
        async function quit() {
            try {
                const response = await fetch(`${API_BASE}/quit`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                if (response.ok) {
                    showMessage('Quit MPV');
                    updateStatus();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }
        
        async function setVolume(level) {
            document.getElementById('volumeValue').textContent = level + '%';
            
            try {
                const response = await fetch(`${API_BASE}/volume`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ level: parseFloat(level) })
                });
                if (response.ok) {
                    showMessage('Volume set to ' + level + '%');
                    updateStatus();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }
        
        async function mute() {
            try {
                const response = await fetch(`${API_BASE}/mute`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                if (response.ok) {
                    showMessage('Muted');
                    updateStatus();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }
        
        async function unmute() {
            try {
                const response = await fetch(`${API_BASE}/unmute`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                if (response.ok) {
                    showMessage('Unmuted');
                    updateStatus();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }
        
        async function updateStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`, {
                    headers: getHeaders()
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const props = data.props || {};
                    
                    document.getElementById('statusTitle').textContent = props['media-title'] || '-';
                    document.getElementById('statusState').textContent = formatPlayerState(data.player_state);
                    if (data.playback_error && data.playback_error !== lastPlaybackErrorShown) {
                        lastPlaybackErrorShown = data.playback_error;
                        showMessage('Playback error: ' + data.playback_error, true);
                    } else if (data.errors && data.errors.length) {
                        showMessage('Status error: ' + data.errors.join('; '), true);
                    } else if (!data.playback_error) {
                        lastPlaybackErrorShown = '';
                    }
                    
                    const position = props['time-pos'];
                    const duration = props['duration'];
                    if (position !== null && duration !== null) {
                        const posMin = Math.floor(position / 60);
                        const posSec = Math.floor(position % 60);
                        const durMin = Math.floor(duration / 60);
                        const durSec = Math.floor(duration % 60);
                        document.getElementById('statusPosition').textContent = 
                            `${posMin}:${posSec.toString().padStart(2, '0')} / ${durMin}:${durSec.toString().padStart(2, '0')}`;
                    } else {
                        document.getElementById('statusPosition').textContent = '-';
                    }
                    
                    const volume = props.volume;
                    if (volume !== null) {
                        document.getElementById('statusVolume').textContent = 
                            Math.round(volume) + '%' + (props.mute ? ' (Muted)' : '');
                        document.getElementById('volumeSlider').value = volume;
                        document.getElementById('volumeValue').textContent = Math.round(volume) + '%';
                    } else {
                        document.getElementById('statusVolume').textContent = '-';
                    }
                    
                    const playlistPos = props['playlist-pos'];
                    const playlistCount = props['playlist-count'];
                    if (playlistPos !== null && playlistCount !== null && playlistCount > 0) {
                        document.getElementById('statusPlaylist').textContent = 
                            `${playlistPos + 1} of ${playlistCount}`;
                    } else {
                        document.getElementById('statusPlaylist').textContent = '-';
                    }
                }
            } catch (err) {
                console.error('Failed to update status:', err);
            }
        }

        async function addFavorite() {
            const url = document.getElementById('favoriteUrlInput').value.trim();
            const name = document.getElementById('favoriteNameInput').value.trim();

            if (!url) {
                showMessage('Please enter a YouTube URL for the favorite', true);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/favorites`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ url, name: name || null })
                });

                if (response.ok) {
                    showMessage('Favorite saved');
                    document.getElementById('favoriteNameInput').value = '';
                    document.getElementById('favoriteUrlInput').value = '';
                    refreshSavedData();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }

        function useCurrentUrlForFavorite() {
            document.getElementById('favoriteUrlInput').value = document.getElementById('urlInput').value.trim();
        }

        async function clearFavorites() {
            await postNoBody('/favorites/clear', 'Favorites cleared');
            refreshSavedData();
        }

        async function clearRecent() {
            await postNoBody('/recent/clear', 'Recent history cleared');
            refreshSavedData();
        }

        async function removeFavorite(url) {
            try {
                const response = await fetch(`${API_BASE}/favorites/remove`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ url })
                });

                if (response.ok) {
                    showMessage('Favorite removed');
                    refreshSavedData();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }

        async function playSavedUrl(url, enqueue = false) {
            document.getElementById('urlInput').value = url;
            await play(enqueue, enqueue ? 'queue' : 'play');
        }

        async function refreshSavedData() {
            await Promise.all([refreshFavorites(), refreshRecent()]);
        }

        async function refreshFavorites() {
            try {
                const response = await fetch(`${API_BASE}/favorites`, {
                    headers: getHeaders()
                });

                if (!response.ok) {
                    return;
                }

                const data = await response.json();
                renderSavedList('favoritesList', data.items || [], true);
            } catch (err) {
                console.error('Failed to refresh favorites:', err);
            }
        }

        async function refreshRecent() {
            try {
                const response = await fetch(`${API_BASE}/recent`, {
                    headers: getHeaders()
                });

                if (!response.ok) {
                    return;
                }

                const data = await response.json();
                renderSavedList('recentList', data.items || [], false);
            } catch (err) {
                console.error('Failed to refresh recents:', err);
            }
        }

        function renderSavedList(elementId, items, canRemove) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';

            if (!items.length) {
                const empty = document.createElement('div');
                empty.className = 'saved-row';
                empty.textContent = canRemove ? 'No favorites yet' : 'No recent URLs yet';
                container.appendChild(empty);
                return;
            }

            items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'saved-row';

                const meta = document.createElement('div');
                meta.className = 'saved-meta';

                const name = document.createElement('div');
                name.className = 'saved-name';
                name.textContent = item.name || item.url;

                const url = document.createElement('div');
                url.className = 'saved-url';
                url.textContent = item.url;

                meta.appendChild(name);
                if (canRemove) {
                    meta.appendChild(url);
                }

                const actions = document.createElement('div');
                actions.className = 'saved-actions';

                const playButton = document.createElement('button');
                playButton.className = 'btn btn-control btn-small';
                playButton.textContent = 'Play';
                playButton.onclick = () => playSavedUrl(item.url, false);
                actions.appendChild(playButton);

                const queueButton = document.createElement('button');
                queueButton.className = 'btn btn-control btn-small';
                queueButton.textContent = 'Queue';
                queueButton.onclick = () => playSavedUrl(item.url, true);
                actions.appendChild(queueButton);

                if (canRemove) {
                    const removeButton = document.createElement('button');
                    removeButton.className = 'btn btn-control btn-small';
                    removeButton.textContent = 'Remove';
                    removeButton.onclick = () => removeFavorite(item.url);
                    actions.appendChild(removeButton);
                }

                row.appendChild(meta);
                row.appendChild(actions);
                container.appendChild(row);
            });
        }

        async function postNoBody(path, successMessage) {
            try {
                const response = await fetch(`${API_BASE}${path}`, {
                    method: 'POST',
                    headers: getHeaders()
                });

                if (response.ok) {
                    showMessage(successMessage);
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }

        function formatPlayerState(state) {
            switch (state) {
                case 'playing':
                    return 'Playing';
                case 'paused':
                    return 'Paused';
                case 'loading':
                    return 'Loading';
                case 'idle':
                    return 'Idle';
                default:
                    return '-';
            }
        }
        
        // Update status every 2 seconds
        setInterval(updateStatus, 2000);
        updateStatus();
        refreshSavedData();
    </script>
</body>
</html>
