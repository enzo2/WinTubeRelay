<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinTubeRelay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            color-scheme: dark;
            --ink: #160d12;
            --plum: #32151f;
            --bark: #523026;
            --leaf: #718b45;
            --leaf-bright: #9aad62;
            --blossom: #f06f7f;
            --blossom-bright: #ff9aa9;
            --petal: #f6b2c2;
            --cream: #fff4e8;
            --muted: #d8bab5;
            --surface: rgba(31, 17, 21, 0.84);
            --surface-raised: rgba(53, 28, 31, 0.78);
            --surface-border: rgba(246, 178, 194, 0.18);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--ink);
            background-image:
                radial-gradient(circle at 12% 8%, rgba(211, 51, 111, 0.2), transparent 34%),
                radial-gradient(circle at 88% 16%, rgba(222, 100, 80, 0.17), transparent 32%),
                radial-gradient(circle at 74% 88%, rgba(113, 139, 69, 0.13), transparent 34%),
                linear-gradient(145deg, var(--ink) 0%, var(--plum) 50%, #282217 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--cream);
            padding: 16px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        h1 {
            display: block;
            margin: 0;
            font-size: clamp(2rem, 7vw, 3.35rem);
            font-weight: 720;
            letter-spacing: 0.055em;
            line-height: 1.2;
            padding: 0.04em 0.08em 0.2em 0;
            overflow: visible;
            background: linear-gradient(105deg, var(--cream) 8%, var(--blossom-bright) 52%, var(--petal) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 3vw, 22px);
            margin: 0 auto 18px;
        }

        .brand-mark {
            width: clamp(112px, 30vw, 190px);
            height: auto;
            flex: 0 0 auto;
            filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.3));
        }

        .brand-copy {
            min-width: 0;
            overflow: visible;
            filter: drop-shadow(0 3px 16px rgba(240, 111, 127, 0.2));
        }

        .brand-kicker {
            display: block;
            margin-bottom: 8px;
            color: var(--petal);
            font-size: clamp(0.62rem, 2vw, 0.76rem);
            font-weight: 650;
            letter-spacing: 0.24em;
            text-transform: uppercase;
        }

        .brand-flourish {
            display: block;
            width: min(100%, 230px);
            height: 2px;
            margin-top: -0.02em;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--blossom), var(--petal) 62%, transparent);
        }
        
        .card {
            background: linear-gradient(145deg, var(--surface-raised), var(--surface));
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid var(--surface-border);
            box-shadow: 0 16px 38px rgba(10, 5, 7, 0.3), inset 0 1px 0 rgba(255, 244, 232, 0.035);
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(246, 178, 194, 0.38);
            border-radius: 8px;
            background: rgba(255, 244, 232, 0.96);
            color: var(--ink);
            font-size: 16px;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: var(--blossom);
            box-shadow: 0 0 0 3px rgba(240, 111, 127, 0.24);
        }
        
        .btn {
            padding: 14px 24px;
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .button-content {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }

        .control-icon {
            width: 22px;
            height: 22px;
            flex: 0 0 auto;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .playback-command {
            display: inline-flex;
            min-height: 68px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .playback-command .control-icon {
            width: 25px;
            height: 25px;
        }

        .compact-command {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .compact-command .control-icon {
            width: 16px;
            height: 16px;
        }

        .play-actions {
            display: grid;
            gap: 10px;
        }
        
        .btn-primary {
            background: var(--blossom);
            color: var(--ink);
            width: 100%;
        }
        
        .btn-primary:hover {
            background: var(--blossom-bright);
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(240, 111, 127, 0.34);
        }

        .btn-secondary {
            background: rgba(113, 139, 69, 0.22);
            border-color: rgba(154, 173, 98, 0.4);
            color: #eff4d4;
            width: 100%;
        }

        .btn-secondary:hover {
            background: rgba(113, 139, 69, 0.34);
            border-color: rgba(176, 194, 116, 0.66);
            transform: translateY(-2px);
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 8rem), 1fr));
            gap: 12px;
        }
        
        .btn-control {
            background: rgba(255, 229, 218, 0.075);
            border-color: rgba(246, 178, 194, 0.17);
            color: var(--cream);
            padding: 16px;
            min-width: 0;
            white-space: normal;
        }
        
        .btn-control:hover {
            background: rgba(240, 111, 127, 0.15);
            border-color: rgba(255, 154, 169, 0.42);
        }
        
        .btn-control:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 12px;
        }

        .volume-control > .control-icon {
            color: var(--leaf-bright);
        }
        
        input[type="range"] {
            flex: 1;
            height: 8px;
            -webkit-appearance: none;
            background: rgba(216, 186, 181, 0.3);
            border-radius: 4px;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: var(--leaf-bright);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 0 0 4px rgba(154, 173, 98, 0.24);
        }
        
        .volume-value {
            min-width: 50px;
            text-align: center;
            font-weight: 600;
        }
        
        .status {
            font-size: 14px;
            line-height: 1.8;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .section-heading label {
            margin-bottom: 0;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(246, 178, 194, 0.12);
        }
        
        .status-item:last-child {
            border-bottom: none;
        }

        .saved-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .saved-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(255, 229, 218, 0.055);
            border: 1px solid rgba(246, 178, 194, 0.1);
        }

        .saved-meta {
            flex: 1;
            min-width: 0;
        }

        .saved-name {
            font-weight: 600;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .saved-url {
            font-size: 12px;
            opacity: 0.75;
            word-break: break-all;
        }

        .saved-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            min-width: 42px;
            height: 42px;
            padding: 0;
            border-radius: 8px;
            font-size: 22px;
            line-height: 1;
            text-transform: none;
            letter-spacing: 0;
        }

        .icon-btn.is-active {
            color: #f5c86f;
            border-color: rgba(245, 200, 111, 0.46);
            background: rgba(245, 200, 111, 0.14);
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
        }

        .inline-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        
        .status-label {
            opacity: 0.7;
        }
        
        .status-value {
            font-weight: 500;
            overflow-wrap: anywhere;
            text-align: right;
        }
        
        .message {
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        
        .message.success {
            background: rgba(92, 119, 52, 0.94);
            display: block;
        }
        
        .message.error {
            background: rgba(167, 42, 61, 0.94);
            display: block;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .control-section {
            margin-top: 18px;
        }

        @media (max-width: 520px) {
            .brand-header {
                align-items: flex-end;
                justify-content: flex-start;
            }

            .brand-mark {
                width: min(34vw, 138px);
            }

            .saved-row {
                align-items: stretch;
                flex-direction: column;
            }

            .saved-meta {
                width: 100%;
            }

            .saved-actions.has-favorite-action {
                display: grid;
                grid-template-columns: 42px repeat(2, minmax(0, 1fr));
                width: 100%;
            }

            .saved-actions .btn-small {
                min-width: 0;
                white-space: normal;
            }

            .status-item {
                align-items: flex-start;
                flex-direction: column;
                gap: 2px;
            }

            .status-value {
                text-align: left;
            }
        }

        @media (min-width: 700px) {
            .play-actions {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (min-width: 900px) {
            body {
                padding: 28px;
            }

            .container {
                display: grid;
                grid-template-columns: minmax(0, 1.05fr) minmax(340px, 0.95fr);
                grid-template-areas:
                    "title title"
                    "play status"
                    "controls status"
                    "favorites recent";
                gap: 18px;
                max-width: 1120px;
            }

            .brand-header {
                grid-area: title;
                justify-content: flex-start;
                margin: 0 0 2px;
            }

            .brand-mark {
                width: 178px;
            }

            .card {
                margin-bottom: 0;
            }

            .play-card {
                grid-area: play;
            }

            .status-card {
                grid-area: status;
            }

            .controls-card {
                grid-area: controls;
            }

            .favorites-card {
                grid-area: favorites;
            }

            .recent-card {
                grid-area: recent;
            }
        }
    </style>
</head>
<body>
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute; overflow: hidden;">
        <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
        <symbol id="icon-queue" viewBox="0 0 24 24"><path d="M4 6h10M4 12h7M4 18h7M17 12v7M13.5 15.5h7"/></symbol>
        <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
        <symbol id="icon-toggle" viewBox="0 0 24 24"><path d="M6 5v14l8-7zM18 6v12"/></symbol>
        <symbol id="icon-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
        <symbol id="icon-skip" viewBox="0 0 24 24"><path d="M6 5v14l9-7zM18 5v14"/></symbol>
        <symbol id="icon-power" viewBox="0 0 24 24"><path d="M12 3v9M7.2 5.8a8 8 0 1 0 9.6 0"/></symbol>
        <symbol id="icon-volume" viewBox="0 0 24 24"><path d="M5 10v4h4l5 4V6L9 10zM17 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/></symbol>
        <symbol id="icon-mute" viewBox="0 0 24 24"><path d="M5 10v4h4l5 4V6L9 10zM17 10l4 4M21 10l-4 4"/></symbol>
    </svg>
    <div class="container">
        <header class="brand-header">
            <img class="brand-mark" src="static/crepe-myrtle-header.png" alt="A naturally branching crepe myrtle in bloom">
            <div class="brand-copy">
                <span class="brand-kicker">Natural playback</span>
                <h1>WinTubeRelay</h1>
                <span class="brand-flourish" aria-hidden="true"></span>
            </div>
        </header>
        
        <div class="card play-card">
            <div class="form-group">
                <label>YouTube URL</label>
                <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=...">
            </div>
            
            <div class="play-actions">
                <button class="btn btn-primary" onclick="play(false, 'play')">
                    <span id="playText" class="button-content"><svg class="control-icon" aria-hidden="true"><use href="#icon-play"></use></svg>Play Now</span>
                    <span id="playSpinner" class="loading" style="display: none;"></span>
                </button>
                <button class="btn btn-secondary" onclick="play(true, 'queue')">
                    <span id="queueText" class="button-content"><svg class="control-icon" aria-hidden="true"><use href="#icon-queue"></use></svg>Add to Queue</span>
                    <span id="queueSpinner" class="loading" style="display: none;"></span>
                </button>
            </div>
            
            <div id="message" class="message"></div>
        </div>

        <div class="card status-card">
            <div class="section-heading">
                <label>Status</label>
                <button class="btn btn-control icon-btn" id="statusFavoriteButton" onclick="toggleCurrentFavorite()" title="Add current item to favorites" aria-label="Add current item to favorites" style="display: none;" disabled>☆</button>
            </div>
            <div class="status" id="status">
                <div class="status-item">
                    <span class="status-label">Title:</span>
                    <span class="status-value" id="statusTitle">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Status:</span>
                    <span class="status-value" id="statusState">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Position:</span>
                    <span class="status-value" id="statusPosition">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Volume:</span>
                    <span class="status-value" id="statusVolume">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Playlist:</span>
                    <span class="status-value" id="statusPlaylist">-</span>
                </div>
            </div>
        </div>

        <div class="card controls-card">
            <label>Playback Controls</label>
            <div class="controls">
                <button class="btn btn-control playback-command" onclick="pause()"><svg class="control-icon" aria-hidden="true"><use href="#icon-pause"></use></svg><span>Pause</span></button>
                <button class="btn btn-control playback-command" onclick="resume()"><svg class="control-icon" aria-hidden="true"><use href="#icon-play"></use></svg><span>Resume</span></button>
                <button class="btn btn-control playback-command" onclick="toggle()"><svg class="control-icon" aria-hidden="true"><use href="#icon-toggle"></use></svg><span>Toggle</span></button>
                <button class="btn btn-control playback-command" onclick="stop()"><svg class="control-icon" aria-hidden="true"><use href="#icon-stop"></use></svg><span>Stop</span></button>
                <button class="btn btn-control playback-command" onclick="skip()"><svg class="control-icon" aria-hidden="true"><use href="#icon-skip"></use></svg><span>Skip</span></button>
                <button class="btn btn-control playback-command" onclick="quit()"><svg class="control-icon" aria-hidden="true"><use href="#icon-power"></use></svg><span>Quit</span></button>
            </div>
            <div class="control-section">
                <label>Volume</label>
                <div class="volume-control">
                    <svg class="control-icon" aria-hidden="true"><use href="#icon-volume"></use></svg>
                    <input type="range" id="volumeSlider" min="0" max="100" value="50" onchange="setVolume(this.value)">
                    <span class="volume-value" id="volumeValue">50%</span>
                </div>
                <div class="controls" style="margin-top: 16px;">
                    <button class="btn btn-control compact-command" onclick="mute()"><svg class="control-icon" aria-hidden="true"><use href="#icon-mute"></use></svg><span>Mute</span></button>
                    <button class="btn btn-control compact-command" onclick="unmute()"><svg class="control-icon" aria-hidden="true"><use href="#icon-volume"></use></svg><span>Unmute</span></button>
                </div>
            </div>
        </div>

        <div class="card favorites-card">
            <div class="section-heading">
                <label>Favorites</label>
                <button class="btn btn-control btn-small" onclick="clearFavorites()">Clear Favorites</button>
            </div>
            <div class="saved-list" id="favoritesList" style="margin-top: 16px;"></div>
        </div>

        <div class="card recent-card">
            <label>Recent</label>
            <div class="inline-actions">
                <button class="btn btn-control btn-small" onclick="refreshSavedData()">Refresh</button>
                <button class="btn btn-control btn-small" onclick="clearRecent()">Clear Recent</button>
            </div>
            <div class="saved-list" id="recentList" style="margin-top: 16px;"></div>
        </div>

    </div>

    <script>
        const API_BASE = '';
        let lastPlaybackErrorShown = '';
        let currentStatusUrl = '';
        let currentStatusTitle = '';
        let currentPlayerState = 'idle';
        let favoritesByUrl = new Set();
        
        function getHeaders() {
            return {
                'Content-Type': 'application/json'
            };
        }

        function setButtonIcon(button, iconName, label) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('class', 'control-icon');
            svg.setAttribute('aria-hidden', 'true');

            const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
            use.setAttribute('href', `#icon-${iconName}`);
            svg.appendChild(use);

            const text = document.createElement('span');
            text.textContent = label;
            button.replaceChildren(svg, text);
        }
        
        function showMessage(text, isError = false) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + (isError ? 'error' : 'success');
            setTimeout(() => {
                msg.className = 'message';
            }, 3000);
        }

        async function getErrorText(response) {
            try {
                const data = await response.json();
                return data.detail || data.error || JSON.stringify(data);
            } catch {
                return await response.text();
            }
        }
        
        function setLoading(elementId, loading) {
            const text = document.getElementById(elementId + 'Text');
            const spinner = document.getElementById(elementId + 'Spinner');
            if (loading) {
                if (text) text.style.display = 'none';
                if (spinner) spinner.style.display = 'inline-block';
            } else {
                if (text) text.style.display = 'inline';
                if (spinner) spinner.style.display = 'none';
            }
        }
        
        async function play(enqueue = false, actionId = 'play') {
            const url = document.getElementById('urlInput').value;
            if (!url) {
                showMessage('Please enter a YouTube URL', true);
                return;
            }
            
            setLoading(actionId, true);
            
            try {
                const response = await fetch(`${API_BASE}/play`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({
                        url: url,
                        enqueue
                    })
                });
                
                if (response.ok) {
                    showMessage(enqueue ? 'Queued URL' : 'Playback request sent');
                    document.getElementById('urlInput').value = '';
                    updateStatus();
                    refreshSavedData();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
            
            setLoading(actionId, false);
        }
        
        async function stop() {
            try {
                const response = await fetch(`${API_BASE}/stop`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                if (response.ok) {
                    showMessage('Stopped');
                    updateStatus();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }
        
        async function pause() {
            try {
                const response = await fetch(`${API_BASE}/pause`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                if (response.ok) {
                    showMessage('Paused');
                    updateStatus();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }
        
        async function resume() {
            try {
                const response = await fetch(`${API_BASE}/resume`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                if (response.ok) {
                    showMessage('Resumed');
                    updateStatus();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }
        
        async function toggle() {
            try {
                const response = await fetch(`${API_BASE}/toggle`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                if (response.ok) {
                    showMessage('Toggled');
                    updateStatus();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }
        
        async function skip() {
            try {
                const response = await fetch(`${API_BASE}/skip`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                if (response.ok) {
                    showMessage('Skipped to next');
                    updateStatus();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }
        
        async function quit() {
            try {
                const response = await fetch(`${API_BASE}/quit`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                if (response.ok) {
                    showMessage('Quit MPV');
                    updateStatus();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }
        
        async function setVolume(level) {
            document.getElementById('volumeValue').textContent = level + '%';
            
            try {
                const response = await fetch(`${API_BASE}/volume`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ level: parseFloat(level) })
                });
                if (response.ok) {
                    showMessage('Volume set to ' + level + '%');
                    updateStatus();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }
        
        async function mute() {
            try {
                const response = await fetch(`${API_BASE}/mute`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                if (response.ok) {
                    showMessage('Muted');
                    updateStatus();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }
        
        async function unmute() {
            try {
                const response = await fetch(`${API_BASE}/unmute`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                if (response.ok) {
                    showMessage('Unmuted');
                    updateStatus();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }
        
        async function updateStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`, {
                    headers: getHeaders()
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const props = data.props || {};
                    currentStatusUrl = typeof props.path === 'string' ? props.path : '';
                    currentStatusTitle = typeof props['media-title'] === 'string' ? props['media-title'] : '';
                    currentPlayerState = data.player_state || 'unknown';
                    
                    document.getElementById('statusTitle').textContent = currentStatusTitle || '-';
                    document.getElementById('statusState').textContent = formatPlayerState(currentPlayerState);
                    updateStatusFavoriteButton();
                    if (data.playback_error && data.playback_error !== lastPlaybackErrorShown) {
                        lastPlaybackErrorShown = data.playback_error;
                        showMessage('Playback error: ' + data.playback_error, true);
                    } else if (data.errors && data.errors.length) {
                        showMessage('Status error: ' + data.errors.join('; '), true);
                    } else if (!data.playback_error) {
                        lastPlaybackErrorShown = '';
                    }
                    
                    const position = props['time-pos'];
                    const duration = props['duration'];
                    if (position !== null && duration !== null) {
                        const posMin = Math.floor(position / 60);
                        const posSec = Math.floor(position % 60);
                        const durMin = Math.floor(duration / 60);
                        const durSec = Math.floor(duration % 60);
                        document.getElementById('statusPosition').textContent = 
                            `${posMin}:${posSec.toString().padStart(2, '0')} / ${durMin}:${durSec.toString().padStart(2, '0')}`;
                    } else {
                        document.getElementById('statusPosition').textContent = '-';
                    }
                    
                    const volume = props.volume;
                    if (volume !== null) {
                        document.getElementById('statusVolume').textContent = 
                            Math.round(volume) + '%' + (props.mute ? ' (Muted)' : '');
                        document.getElementById('volumeSlider').value = volume;
                        document.getElementById('volumeValue').textContent = Math.round(volume) + '%';
                    } else {
                        document.getElementById('statusVolume').textContent = '-';
                    }
                    
                    const playlistPos = props['playlist-pos'];
                    const playlistCount = props['playlist-count'];
                    if (playlistPos !== null && playlistCount !== null && playlistCount > 0) {
                        document.getElementById('statusPlaylist').textContent = 
                            `${playlistPos + 1} of ${playlistCount}`;
                    } else {
                        document.getElementById('statusPlaylist').textContent = '-';
                    }
                }
            } catch (err) {
                console.error('Failed to update status:', err);
            }
        }

        async function addFavorite(url, name) {
            if (!url) {
                showMessage('No playable URL is available to favorite', true);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/favorites`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ url, name: name || null })
                });

                if (response.ok) {
                    showMessage('Favorite saved');
                    refreshSavedData();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }

        async function toggleFavorite(url, name) {
            if (!url) {
                showMessage('No playable URL is available to favorite', true);
                return;
            }

            if (favoritesByUrl.has(normalizeUrl(url))) {
                await removeFavorite(url, 'Favorite removed');
            } else {
                await addFavorite(url, name);
            }
        }

        async function toggleCurrentFavorite() {
            await toggleFavorite(currentStatusUrl, currentStatusTitle);
        }

        async function clearFavorites() {
            await postNoBody('/favorites/clear', 'Favorites cleared');
            refreshSavedData();
        }

        async function clearRecent() {
            await postNoBody('/recent/clear', 'Recent history cleared');
            refreshSavedData();
        }

        async function removeFavorite(url, message = 'Favorite removed') {
            try {
                const response = await fetch(`${API_BASE}/favorites/remove`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ url })
                });

                if (response.ok) {
                    showMessage(message);
                    refreshSavedData();
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }

        async function playSavedUrl(url, enqueue = false) {
            document.getElementById('urlInput').value = url;
            await play(enqueue, enqueue ? 'queue' : 'play');
        }

        async function refreshSavedData() {
            await refreshFavorites();
            await refreshRecent();
        }

        async function refreshFavorites() {
            try {
                const response = await fetch(`${API_BASE}/favorites`, {
                    headers: getHeaders()
                });

                if (!response.ok) {
                    return;
                }

                const data = await response.json();
                favoritesByUrl = new Set((data.items || []).map(item => normalizeUrl(item.url)));
                renderSavedList('favoritesList', data.items || [], true);
                updateStatusFavoriteButton();
            } catch (err) {
                console.error('Failed to refresh favorites:', err);
            }
        }

        async function refreshRecent() {
            try {
                const response = await fetch(`${API_BASE}/recent`, {
                    headers: getHeaders()
                });

                if (!response.ok) {
                    return;
                }

                const data = await response.json();
                renderSavedList('recentList', data.items || [], false);
            } catch (err) {
                console.error('Failed to refresh recents:', err);
            }
        }

        function renderSavedList(elementId, items, canRemove) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';

            if (!items.length) {
                const empty = document.createElement('div');
                empty.className = 'saved-row';
                empty.textContent = canRemove ? 'No favorites yet' : 'No recent URLs yet';
                container.appendChild(empty);
                return;
            }

            items.forEach(item => {
                const itemIsFavorite = favoritesByUrl.has(normalizeUrl(item.url));
                const row = document.createElement('div');
                row.className = 'saved-row';

                const meta = document.createElement('div');
                meta.className = 'saved-meta';

                const name = document.createElement('div');
                name.className = 'saved-name';
                name.textContent = item.name || item.url;

                const url = document.createElement('div');
                url.className = 'saved-url';
                url.textContent = item.url;

                meta.appendChild(name);
                if (canRemove) {
                    meta.appendChild(url);
                }

                const actions = document.createElement('div');
                actions.className = 'saved-actions';

                if (!canRemove) {
                    actions.classList.add('has-favorite-action');
                    const favoriteButton = document.createElement('button');
                    favoriteButton.className = 'btn btn-control icon-btn' + (itemIsFavorite ? ' is-active' : '');
                    favoriteButton.textContent = itemIsFavorite ? '★' : '☆';
                    favoriteButton.title = itemIsFavorite ? 'Remove from favorites' : 'Add to favorites';
                    favoriteButton.setAttribute('aria-label', favoriteButton.title);
                    favoriteButton.onclick = () => toggleFavorite(item.url, item.name);
                    actions.appendChild(favoriteButton);
                }

                const playButton = document.createElement('button');
                playButton.className = 'btn btn-control btn-small compact-command';
                setButtonIcon(playButton, 'play', 'Play');
                playButton.onclick = () => playSavedUrl(item.url, false);
                actions.appendChild(playButton);

                const queueButton = document.createElement('button');
                queueButton.className = 'btn btn-control btn-small compact-command';
                setButtonIcon(queueButton, 'queue', 'Queue');
                queueButton.onclick = () => playSavedUrl(item.url, true);
                actions.appendChild(queueButton);

                if (canRemove) {
                    const removeButton = document.createElement('button');
                    removeButton.className = 'btn btn-control btn-small';
                    removeButton.textContent = 'Remove';
                    removeButton.onclick = () => removeFavorite(item.url);
                    actions.appendChild(removeButton);
                }

                row.appendChild(meta);
                row.appendChild(actions);
                container.appendChild(row);
            });
        }

        function updateStatusFavoriteButton() {
            const button = document.getElementById('statusFavoriteButton');
            if (!button) {
                return;
            }

            const isPlayable = !!currentStatusUrl && currentPlayerState === 'playing';
            const isFavorite = favoritesByUrl.has(normalizeUrl(currentStatusUrl));

            button.style.display = isPlayable ? 'inline-flex' : 'none';
            button.disabled = !isPlayable;
            button.classList.toggle('is-active', isPlayable && isFavorite);
            button.textContent = isFavorite ? '★' : '☆';
            button.title = isFavorite ? 'Remove current item from favorites' : 'Add current item to favorites';
            button.setAttribute('aria-label', button.title);
        }

        function normalizeUrl(url) {
            return (url || '').trim().toLowerCase();
        }

        async function postNoBody(path, successMessage) {
            try {
                const response = await fetch(`${API_BASE}${path}`, {
                    method: 'POST',
                    headers: getHeaders()
                });

                if (response.ok) {
                    showMessage(successMessage);
                } else {
                    showMessage('Error: ' + await getErrorText(response), true);
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            }
        }

        function formatPlayerState(state) {
            switch (state) {
                case 'playing':
                    return 'Playing';
                case 'paused':
                    return 'Paused';
                case 'loading':
                    return 'Loading';
                case 'idle':
                    return 'Idle';
                default:
                    return '-';
            }
        }
        
        // Update status every 2 seconds
        setInterval(updateStatus, 2000);
        updateStatus();
        refreshSavedData();
    </script>
</body>
</html>
